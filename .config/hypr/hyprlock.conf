# PASSWORD
input-field {
    monitor = eDP-1
    size = 325, 66
    position = 60, -120
    halign = left
    valign = center
    outline_thickness = 2

    rounding = 5
    outer_color = rgba(251, 241, 199, 1.0)
    inner_color = rgba(0, 0, 0, 0)
    font_color = rgba(251, 241, 199, 1.0)

    font_family = JetBrainsMono NF Bold
    placeholder_text = Password
    dots_size = 0.25
    dots_spacing = 0.4
    fade_on_empty = true
}


