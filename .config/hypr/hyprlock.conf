general {
  hide_cursor = false
  grace = 0
}

background {
  monitor = eDP-1
  path = ~/Imagens/wallpapers/samurai-dark.png
  blur_passes = 0
  blur_size = 1
}

# CLOCK
label {
  monitor = eDP-1
  text = cmd[update:1000] TZ="America/Cancun" date +"%H:%M"
  font_family = JetBrainsMono NF Bold
  font_size = 112
  color = rgba(251, 241, 199, 1.0)
  position = 60, 120
  halign = left
  valign = center
}

# DATE
label {
  monitor = eDP-1
  text = cmd[update:60000] TZ="America/Cancun" date +"%d/%m/%Y"
  font_family = JetBrainsMono NF Bold
  font_size = 22
  color = rgba(251, 241, 199, 1.0)
  position = 70, 10
  halign = left
  valign = center
}

